version: "3.8"
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: recipes
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: .
    command: npm run dev
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - DATABASE_URL=postgresql://app:pass@db:5432/recipes
      - REDIS_URL=redis://redis:6379
      - RL_BASE=http://rl-service:8000
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis
      - rl-service # đảm bảo rl-service start trước

  rl-service:
    image: tiangolo/uvicorn-gunicorn-fastapi:python3.11
    volumes:
      - ./rl_mock:/app
    ports:
      - "8000:8000"
    environment:
      - MODULE_NAME=main # đảm bảo uvicorn load đúng file
      - VARIABLE_NAME=app
      - PORT=8000
      - HOST=0.0.0.0
    restart: always

volumes:
  pgdata:
